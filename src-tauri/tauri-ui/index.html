<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Japanese Analyzer</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./desktop.js" defer></script>
</head>
<body>
  <!-- 全屏磁性跟随光标（仅在 Ready 仪式感阶段激活） -->
  <div id="ambient-cursor" class="ambient-cursor" aria-hidden="true">
    <div class="cursor-ring"></div>
    <div class="cursor-core"></div>
  </div>

  <main id="app">
    <!-- 主角区：文句解构展示容器 -->
    <section class="stage-container" id="stage-box" aria-live="polite">
      <!-- 动态注音分词句子容器 -->
      <div class="quote-wrapper" id="quote-wrapper"></div>
      
      <!-- 极细紫色进度底线 -->
      <div class="progress-track" id="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <!-- 意境释义（带流式打字与呼吸光晕） -->
      <div class="quote-translation" id="quote-translation"></div>

      <!-- 状态与辅助提示（日常启动或加载中显示） -->
      <p id="status" class="status-indicator" role="status"></p>

      <!-- 首次启动：极简打字提示指示区（彻底无厚重按钮，零视觉负担） -->
      <div class="zen-prompt-area" id="zen-prompt-area" hidden>
        <div class="shortcut-tip">
          <span class="shortcut-text" id="shortcut-text"></span>
          <span class="shortcut-cursor" aria-hidden="true"></span>
        </div>
      </div>
    </section>

    <!-- 异常与重试交互区（默认隐藏） -->
    <div class="actions" id="error-actions">
      <button id="retry" hidden></button>
      <button id="reassign-port" hidden></button>
    </div>
    <p id="log" class="detail" hidden></p>

    <!-- 桌面设置区（快捷键打开，默认隐藏） -->
    <section id="settings" hidden>
      <h2>桌面设置 / Desktop settings</h2>
      <p id="version"></p>
      <p id="update-status" role="status" aria-live="polite"></p>
      <p id="update-notes" class="detail"></p>
      <div class="actions">
        <button id="check-update">检查更新 / Check for updates</button>
        <button id="install-update" hidden>安装并重启 / Install and restart</button>
        <button id="releases">下载完整安装包 / Download installer</button>
      </div>
      <p class="detail">Windows：下载并运行完整安装包以更新全部组件。<br />Windows: download and run the full installer to update all components.</p>
    </section>
  </main>
</body>
</html>
