<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Japanese Analyzer</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./desktop.js" defer></script>
</head>
<body>
  <main>
    <img src="./logo.png" width="88" height="84" alt="Japanese Analyzer" />
    <h1>日本語文章解析器</h1>
    <p id="status" role="status" aria-live="polite">正在启动… / Starting…</p>
    <button id="retry" hidden>重试 / Retry</button>
    <p id="log" class="detail" hidden></p>
    <section id="settings" hidden>
      <h2>桌面设置 / Desktop settings</h2>
      <p id="version"></p>
      <p id="update-status" role="status" aria-live="polite"></p>
      <p id="update-notes" class="detail"></p>
      <div class="actions">
        <button id="check-update">检查更新 / Check for updates</button>
        <button id="install-update" hidden>安装并重启 / Install and restart</button>
        <button id="releases">下载完整安装包 / Download installer</button>
      </div>
      <p class="detail">Windows：下载并运行完整安装包以更新全部组件。<br />Windows: download and run the full installer to update all components.</p>
    </section>
  </main>
</body>
</html>
