name: Desktop releases

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate shared application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned runtime
        id: node
        run: echo "version=$(node -p 'require("./package.json").desktop.nodeVersion')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
      - run: node scripts/desktop/sync-version.mjs
      - run: npm ci
      - name: Verify Tauri Action CLI entry point
        run: npm run tauri -- --version
      - run: npm test
      - run: npm run desktop:test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Archive validated web output (preserve dotfiles and permissions)
        run: tar --exclude='.env*' -czf desktop-web.tar.gz .next/standalone .next/static .next/desktop-build.json public
      - uses: actions/upload-artifact@v5
        with:
          name: validated-desktop-web
          path: desktop-web.tar.gz
          retention-days: 7

  release:
    name: Prepare desktop release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Create release once for all native jobs
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const tagged = context.ref.startsWith('refs/tags/');
            const tag = tagged ? context.ref.slice('refs/tags/'.length) : `desktop-preview-${context.runId}`;
            const params = { owner: context.repo.owner, repo: context.repo.repo };
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ ...params, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                ...params, tag_name: tag, target_commitish: context.sha,
                name: `Japanese Analyzer ${tag}`, draft: !tagged,
                prerelease: tagged && tag.includes('-'),
                body: 'Desktop builds for macOS (Apple Silicon / Intel) and Windows x64. Windows updates use the full NSIS installer. See docs/desktop.md for installation and signing details.',
              })).data;
            }
            core.setOutput('id', String(release.id));
            core.setOutput('tag', tag);

  build:
    name: Build ${{ matrix.target }}
    needs: [validate, release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            node_arch: arm64
            updater_target: darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
            node_arch: x64
            updater_target: darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            node_arch: x64
            updater_target: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Read pinned runtime
        id: node
        run: echo "version=$(node -p 'require("./package.json").desktop.nodeVersion')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.node.outputs.version }}
          architecture: ${{ matrix.node_arch }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: node scripts/desktop/sync-version.mjs
      - run: npm ci
      # Next may trace optional native modules. A Linux standalone artifact cannot
      # safely be used for macOS/Windows; build again on the actual OS/architecture.
      - run: npm run build
      - run: npm run desktop:package-server
      - name: Smoke bundled Node and standalone (also on Windows)
        run: node scripts/desktop/smoke-server.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Enable updater artifacts only when signing is configured
        id: signing
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -n "$PRIVATE_KEY" ]]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > src-tauri/tauri.signing.conf.json
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/tauri.signing.conf.json
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Updater signing key missing. Installers will build without in-app update artifacts.'
          fi
      - name: Build and attach native installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          tagName: ${{ needs.release.outputs.tag }}
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }} --config src-tauri/tauri.signing.conf.json
          includeUpdaterJson: false
      - name: Upload signed update record
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: updater-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: error

  updater-manifests:
    name: Publish complete updater manifests
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Assemble per-OS manifests after all native uploads finish
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.release.outputs.id }}
        with:
          script: |
            const { publishManifests } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/desktop/publish-manifests.mjs`);
            await publishManifests(github, context.repo, Number(process.env.RELEASE_ID));
